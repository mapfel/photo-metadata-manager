[project]
name = "metadata-comparer"
version = "0.1.0"
description = "Compare image metadata across Exif, embedded XMP, sidecar XMP and IPTC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.8",
    "exiv2>=0.17",
    "PyYAML>=6.0",
]

[project.gui-scripts]
metadata-comparer = "metadata_comparer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_comparer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Qt model overrides conventionally default `parent` to QModelIndex().
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
